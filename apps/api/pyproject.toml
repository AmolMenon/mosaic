[project]
name = "mosaic-api"
version = "0.1.0"
description = "Mosaic FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",
    "redis>=5.0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
