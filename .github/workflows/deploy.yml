name: Deploy to Production

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and Push Web
        uses: docker/build-push-action@v4
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:latest
          
      - name: Build and Push API
        uses: docker/build-push-action@v4
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest

      - name: Deploy
        run: |
          echo "Deploying to production server via SSH"
          # SSH commands to deploy via docker-compose would go here
