version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mosaic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/mosaic_db?schema=public
      - PORT=3000
      - NODE_ENV=production
      # - JWT_SECRET=...
      # - OPENAI_API_KEY=...
      # - ANTHROPIC_API_KEY=...
      # - GEMINI_API_KEY=...
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    ports:
      - "3000:3001"
    environment:
      - API_URL=http://api:3000
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3001
      - NODE_ENV=production
    depends_on:
      - api

volumes:
  postgres_data:
